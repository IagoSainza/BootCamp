<!DOCTYPE html>
<html lang="es">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulario de registro</title>
    </head>

    <body>
        <header> 
            <h1> 
            <img src= "./Fotos3/Dado.jpg" alt=" Img Formulario " height=" 36 ">
            <strong> Formulario de Registro D&D </strong> 
            </h1>
        </header>

        <main>

            <div>Completa todos los campos para crear tu cuenta.</div>

            <br>
            <form action="#" method="post">

            <div>
                <label for="Usuario">Nombre de Usuario: </label> 
                <input type="text" id="Usuario" name="nombre_usuario" required>
            </div>

            <br>

            <div> 
                <label for="email">Correo Electrónico: </label> 
                <input type="email" id="email" name="email" required>
            </div>
            
            <br>

            <div>
                <label for="password">Contraseña: </label>
                <input type="password" id="password" name="password" required>
            </div>
                                                              
            <br>

            <div>
                <label for="edad">Fecha de Nacimiento: </label> 
                <input type="date" id="edad" name="edad" required>
            </div>
                                                                
            <br><br>

            <div> Género: </div>
            
            <br>
            <div>
                <input type="radio" id="Masculino" name="genero" value="Masculino"required>
                <label for="Masculino"> Masculino </label>

                <input type="radio" id="Femenino" name="genero" value="Femenino" required>
                <label for="Femenino"> Femenino </label> 


                <input type="radio"  id="Otro" name="genero" value="Otro" required>
                <label for="Otro"> Otro </label>

            </div>
                                                                        
            <br> <br>
                                                                        
            <div> Escoge el rol para tu personaje: </div>
            
            <br>

            <div>
                <input type="checkbox" id="Melee" name="rol" value="Melee">
                <label for="Melee">
                <img src="./Fotos3/Armadura.jpg" alt="Melee" height="40"> Melee
                </label>

                <input type="checkbox" id="Wizard" name="rol" value="Wizard">
                <label for="Wizard">
                <img src="./Fotos3/Fire.jpg" alt="Wizard" height="40"> Wizard
                </label>

                <input type="checkbox" id="Ranger" name="rol" value="Ranger"> 
                <label for="Ranger">
                <img src="./Fotos3/daga.jpg" alt="Ranger" height="40"> Ranger
                </label>
            </div>
                                                                            
            <br>

            <div>
                <label for="Datos_adicionales">Datos adicionales para la ficha del jugador:</label>
                                                                                    
            <br>
                <textarea id="Datos_adicionales" name="Datos_adicionales" cols="30" placeholder="Ej. Transfondo, Raza... "></textarea>
                                                                                    
            </div>
            
            <br>
            <div>
            <button type="submit">
            <img src="./Fotos3/libro.png" alt="Enviar" height="30">    Enviar.
            </button>
            </div>
            </form>
        </main>
    </body>
    </html>>
